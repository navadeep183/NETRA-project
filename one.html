<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--forms -->
    <form action>
        <label for="FirstName">Name:</label>
        <input type="text" name="FirstName" id="FirstName" placeholder="Enter first Name"><br>
        <label for="LastName">Last Name:</label>
        <input type="text" name="LastName" id="LastName" placeholder="Enter Last Name"><br
        <label for="Password">Password:</label>
        <input type="password" name="Password" id="Password" placeholder="Enter Password"><br>
        <label for="Gender">Gender:</label>
        <input type="radio" name="Gender" id="" value="Male">Male
        <input type="radio" name="Gender" id="" value="Female">Female
        <input type="radio" name="Gender" id="" value="Other">Other<br>
        <label for="Skills">Skills:</label>
        <input type="checkbox" name="C" id="" value="C">C
        <input type="checkbox" name="C++" id="" value="C++">C++
        <input type="checkbox" name="Java" id="" value="Java">Java
        <input type="checkbox" name="Python" id="" value="Python">Python<br>
        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob"><br>
        <label type="email">Email</label>
        <input type="email" name="email" id=""placeholder="EMAIL"><br>
        <label for="yearofstudy">year of study</label>
        <select name="year of study" id="yearofstudy">
            <optgroup label="year of study">
            <option value="1st year">1st Year</option>
            <option value="2nd year">2nd Year</option>
            <option value="3rd year">3rd Year</option>
            <option value="4th year">4th Year</option>  
            </optgroup>
        </select><br>
        <label for="adderss">Address:</label>
        <textarea name="adderss" id="" cols="30" rows="10"></textarea><br>
        <label for="Color">Color:</label>
        <input type="color" name="Color" id=""><br>
        <input type="button" value="Clear">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
